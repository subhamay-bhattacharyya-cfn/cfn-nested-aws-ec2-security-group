AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Creates an EC2 security group with up to five ingress rules. Each rule selects its own
  named rule set and has its own source, which is either a CIDR block or another security group.
  Egress uses the default allow-all rule.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: VPC
        Parameters:
          - VpcId
      - Label:
          default: Security Group Name and Description
        Parameters:
          - ProjectName
          - Environment
          - SecurityGroupBaseName
          - SecurityGroupDescription
          - CiSuffix
      - Label:
          default: Security Group Rule 1
        Parameters:
          - Rule1RuleSet
          - Rule1SourceCidr
          - Rule1SourceSecurityGroupId
      - Label:
          default: Security Group Rule 2
        Parameters:
          - Rule2RuleSet
          - Rule2SourceCidr
          - Rule2SourceSecurityGroupId
      - Label:
          default: Security Group Rule 3
        Parameters:
          - Rule3RuleSet
          - Rule3SourceCidr
          - Rule3SourceSecurityGroupId
      - Label:
          default: Security Group Rule 4
        Parameters:
          - Rule4RuleSet
          - Rule4SourceCidr
          - Rule4SourceSecurityGroupId
      - Label:
          default: Security Group Rule 5
        Parameters:
          - Rule5RuleSet
          - Rule5SourceCidr
          - Rule5SourceSecurityGroupId

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC in which to create the security group

  ProjectName:
    Type: String
    Default: "cfn-nested"
    Description: Project name used as the first part of the security group name
    MinLength: 1
    MaxLength: 40
    AllowedPattern: "^[a-zA-Z0-9-]+$"
    ConstraintDescription: Use only letters, numbers, and hyphens.

  Environment:
    Type: String
    AllowedValues:
      - devl
      - stag
      - prod
    Description: Environment name used in the security group name

  SecurityGroupBaseName:
    Type: String
    Description: Base name for the security group. The group is named <ProjectName>-<SecurityGroupBaseName>-<Environment>-<region>.
    MinLength: 1
    MaxLength: 80
    AllowedPattern: "^[a-zA-Z0-9-]+$"
    ConstraintDescription: Use only letters, numbers, and hyphens.

  CiSuffix:
    Type: String
    Default: ""
    Description: Optional suffix appended to the security group name, used for CI deployments. Leave blank for none.
    MaxLength: 20
    AllowedPattern: "^$|^[a-zA-Z0-9-]+$"
    ConstraintDescription: Use only letters, numbers, and hyphens.

  SecurityGroupDescription:
    Type: String
    Default: ""
    Description: Security group description. Leave blank to generate one from the stack name.
    MaxLength: 255

  Rule1RuleSet:
    Type: String
    AllowedValues:
      - None
      - WebServer
      - SSHOnly
      - AppTier
      - Dev
      - RDSMySQL
      - AuroraMySQL
      - AuroraPostgreSQL
      - RDSOracle
      - RDSSQLServer
      - RDSPostgreSQL
    Description: Named rule set whose rule 1 is created. Choose None to skip this rule.

  Rule1SourceCidr:
    Type: String
    Default: ""
    Description: CIDR block allowed to reach rule 1 (set this or Rule1SourceSecurityGroupId, not both)
    AllowedPattern: "^$|^(\\d{1,3}\\.){3}\\d{1,3}/\\d{1,2}$"
    ConstraintDescription: Must be a valid IPv4 CIDR block such as 10.0.0.0/16

  Rule1SourceSecurityGroupId:
    Type: String
    Default: ""
    Description: Security group ID allowed to reach rule 1 (set this or Rule1SourceCidr, not both)
    AllowedPattern: "^$|^sg-[0-9a-f]{8,17}$"
    ConstraintDescription: Must be a security group ID such as sg-0123456789abcdef0

  Rule2RuleSet:
    Type: String
    AllowedValues:
      - None
      - WebServer
      - SSHOnly
      - AppTier
      - Dev
      - RDSMySQL
      - AuroraMySQL
      - AuroraPostgreSQL
      - RDSOracle
      - RDSSQLServer
      - RDSPostgreSQL
    Description: Named rule set whose rule 2 is created. Choose None to skip this rule.

  Rule2SourceCidr:
    Type: String
    Default: ""
    Description: CIDR block allowed to reach rule 2 (set this or Rule2SourceSecurityGroupId, not both)
    AllowedPattern: "^$|^(\\d{1,3}\\.){3}\\d{1,3}/\\d{1,2}$"
    ConstraintDescription: Must be a valid IPv4 CIDR block such as 10.0.0.0/16

  Rule2SourceSecurityGroupId:
    Type: String
    Default: ""
    Description: Security group ID allowed to reach rule 2 (set this or Rule2SourceCidr, not both)
    AllowedPattern: "^$|^sg-[0-9a-f]{8,17}$"
    ConstraintDescription: Must be a security group ID such as sg-0123456789abcdef0

  Rule3RuleSet:
    Type: String
    AllowedValues:
      - None
      - WebServer
      - SSHOnly
      - AppTier
      - Dev
      - RDSMySQL
      - AuroraMySQL
      - AuroraPostgreSQL
      - RDSOracle
      - RDSSQLServer
      - RDSPostgreSQL
    Description: Named rule set whose rule 3 is created. Choose None to skip this rule.

  Rule3SourceCidr:
    Type: String
    Default: ""
    Description: CIDR block allowed to reach rule 3 (set this or Rule3SourceSecurityGroupId, not both)
    AllowedPattern: "^$|^(\\d{1,3}\\.){3}\\d{1,3}/\\d{1,2}$"
    ConstraintDescription: Must be a valid IPv4 CIDR block such as 10.0.0.0/16

  Rule3SourceSecurityGroupId:
    Type: String
    Default: ""
    Description: Security group ID allowed to reach rule 3 (set this or Rule3SourceCidr, not both)
    AllowedPattern: "^$|^sg-[0-9a-f]{8,17}$"
    ConstraintDescription: Must be a security group ID such as sg-0123456789abcdef0

  Rule4RuleSet:
    Type: String
    AllowedValues:
      - None
      - WebServer
      - SSHOnly
      - AppTier
      - Dev
      - RDSMySQL
      - AuroraMySQL
      - AuroraPostgreSQL
      - RDSOracle
      - RDSSQLServer
      - RDSPostgreSQL
    Description: Named rule set whose rule 4 is created. Choose None to skip this rule.

  Rule4SourceCidr:
    Type: String
    Default: ""
    Description: CIDR block allowed to reach rule 4 (set this or Rule4SourceSecurityGroupId, not both)
    AllowedPattern: "^$|^(\\d{1,3}\\.){3}\\d{1,3}/\\d{1,2}$"
    ConstraintDescription: Must be a valid IPv4 CIDR block such as 10.0.0.0/16

  Rule4SourceSecurityGroupId:
    Type: String
    Default: ""
    Description: Security group ID allowed to reach rule 4 (set this or Rule4SourceCidr, not both)
    AllowedPattern: "^$|^sg-[0-9a-f]{8,17}$"
    ConstraintDescription: Must be a security group ID such as sg-0123456789abcdef0

  Rule5RuleSet:
    Type: String
    AllowedValues:
      - None
      - WebServer
      - SSHOnly
      - AppTier
      - Dev
      - RDSMySQL
      - AuroraMySQL
      - AuroraPostgreSQL
      - RDSOracle
      - RDSSQLServer
      - RDSPostgreSQL
    Description: Named rule set whose rule 5 is created. Choose None to skip this rule.

  Rule5SourceCidr:
    Type: String
    Default: ""
    Description: CIDR block allowed to reach rule 5 (set this or Rule5SourceSecurityGroupId, not both)
    AllowedPattern: "^$|^(\\d{1,3}\\.){3}\\d{1,3}/\\d{1,2}$"
    ConstraintDescription: Must be a valid IPv4 CIDR block such as 10.0.0.0/16

  Rule5SourceSecurityGroupId:
    Type: String
    Default: ""
    Description: Security group ID allowed to reach rule 5 (set this or Rule5SourceCidr, not both)
    AllowedPattern: "^$|^sg-[0-9a-f]{8,17}$"
    ConstraintDescription: Must be a security group ID such as sg-0123456789abcdef0

Rules:
  Rule1SingleSource:
    Assertions:
      - Assert: !Not
          - !And
            - !Not [!Equals [!Ref Rule1SourceCidr, ""]]
            - !Not [!Equals [!Ref Rule1SourceSecurityGroupId, ""]]
        AssertDescription: Set only one of Rule1SourceCidr or Rule1SourceSecurityGroupId

  Rule2SingleSource:
    Assertions:
      - Assert: !Not
          - !And
            - !Not [!Equals [!Ref Rule2SourceCidr, ""]]
            - !Not [!Equals [!Ref Rule2SourceSecurityGroupId, ""]]
        AssertDescription: Set only one of Rule2SourceCidr or Rule2SourceSecurityGroupId

  Rule3SingleSource:
    Assertions:
      - Assert: !Not
          - !And
            - !Not [!Equals [!Ref Rule3SourceCidr, ""]]
            - !Not [!Equals [!Ref Rule3SourceSecurityGroupId, ""]]
        AssertDescription: Set only one of Rule3SourceCidr or Rule3SourceSecurityGroupId

  Rule4SingleSource:
    Assertions:
      - Assert: !Not
          - !And
            - !Not [!Equals [!Ref Rule4SourceCidr, ""]]
            - !Not [!Equals [!Ref Rule4SourceSecurityGroupId, ""]]
        AssertDescription: Set only one of Rule4SourceCidr or Rule4SourceSecurityGroupId

  Rule5SingleSource:
    Assertions:
      - Assert: !Not
          - !And
            - !Not [!Equals [!Ref Rule5SourceCidr, ""]]
            - !Not [!Equals [!Ref Rule5SourceSecurityGroupId, ""]]
        AssertDescription: Set only one of Rule5SourceCidr or Rule5SourceSecurityGroupId

Mappings:
  # Each rule set is "protocol,fromPort,toPort" per rule slot. Unused slots are "none".
  # Rule N of a stack is built from slot RuleN of the rule set chosen for it by RuleNRuleSet.
  # The traffic source is supplied by the RuleN source parameters, not stored here.
  IngressRuleSets:
    None:
      Rule1: "none"
      Rule2: "none"
      Rule3: "none"
      Rule4: "none"
      Rule5: "none"
    WebServer:
      Rule1: "tcp,80,80"
      Rule2: "tcp,443,443"
      Rule3: "none"
      Rule4: "none"
      Rule5: "none"
    SSHOnly:
      Rule1: "tcp,22,22"
      Rule2: "none"
      Rule3: "none"
      Rule4: "none"
      Rule5: "none"
    AppTier:
      Rule1: "tcp,8000,8080"
      Rule2: "tcp,9090,9090"
      Rule3: "none"
      Rule4: "none"
      Rule5: "none"
    Dev:
      Rule1: "tcp,22,22"
      Rule2: "tcp,80,80"
      Rule3: "tcp,8000,8080"
      Rule4: "none"
      Rule5: "none"
    RDSMySQL:
      Rule1: "tcp,3306,3306"
      Rule2: "none"
      Rule3: "none"
      Rule4: "none"
      Rule5: "none"
    AuroraMySQL:
      Rule1: "tcp,3306,3306"
      Rule2: "none"
      Rule3: "none"
      Rule4: "none"
      Rule5: "none"
    AuroraPostgreSQL:
      Rule1: "tcp,5432,5432"
      Rule2: "none"
      Rule3: "none"
      Rule4: "none"
      Rule5: "none"
    RDSOracle:
      Rule1: "tcp,1521,1521"
      Rule2: "none"
      Rule3: "none"
      Rule4: "none"
      Rule5: "none"
    RDSSQLServer:
      Rule1: "tcp,1433,1433"
      Rule2: "none"
      Rule3: "none"
      Rule4: "none"
      Rule5: "none"
    RDSPostgreSQL:
      Rule1: "tcp,5432,5432"
      Rule2: "none"
      Rule3: "none"
      Rule4: "none"
      Rule5: "none"

Conditions:
  HasSecurityGroupDescription: !Not [!Equals [!Ref SecurityGroupDescription, ""]]
  HasCiSuffix: !Not [!Equals [!Ref CiSuffix, ""]]

  HasRule1: !Not [!Equals [!FindInMap [IngressRuleSets, !Ref Rule1RuleSet, Rule1], "none"]]
  HasRule1Cidr: !And [!Condition HasRule1, !Not [!Equals [!Ref Rule1SourceCidr, ""]]]
  HasRule1SecurityGroup: !And [!Condition HasRule1, !Not [!Equals [!Ref Rule1SourceSecurityGroupId, ""]]]

  HasRule2: !Not [!Equals [!FindInMap [IngressRuleSets, !Ref Rule2RuleSet, Rule2], "none"]]
  HasRule2Cidr: !And [!Condition HasRule2, !Not [!Equals [!Ref Rule2SourceCidr, ""]]]
  HasRule2SecurityGroup: !And [!Condition HasRule2, !Not [!Equals [!Ref Rule2SourceSecurityGroupId, ""]]]

  HasRule3: !Not [!Equals [!FindInMap [IngressRuleSets, !Ref Rule3RuleSet, Rule3], "none"]]
  HasRule3Cidr: !And [!Condition HasRule3, !Not [!Equals [!Ref Rule3SourceCidr, ""]]]
  HasRule3SecurityGroup: !And [!Condition HasRule3, !Not [!Equals [!Ref Rule3SourceSecurityGroupId, ""]]]

  HasRule4: !Not [!Equals [!FindInMap [IngressRuleSets, !Ref Rule4RuleSet, Rule4], "none"]]
  HasRule4Cidr: !And [!Condition HasRule4, !Not [!Equals [!Ref Rule4SourceCidr, ""]]]
  HasRule4SecurityGroup: !And [!Condition HasRule4, !Not [!Equals [!Ref Rule4SourceSecurityGroupId, ""]]]

  HasRule5: !Not [!Equals [!FindInMap [IngressRuleSets, !Ref Rule5RuleSet, Rule5], "none"]]
  HasRule5Cidr: !And [!Condition HasRule5, !Not [!Equals [!Ref Rule5SourceCidr, ""]]]
  HasRule5SecurityGroup: !And [!Condition HasRule5, !Not [!Equals [!Ref Rule5SourceSecurityGroupId, ""]]]

Resources:
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !If
        - HasCiSuffix
        - !Sub "${ProjectName}-${SecurityGroupBaseName}-${Environment}-${AWS::Region}-${CiSuffix}"
        - !Sub "${ProjectName}-${SecurityGroupBaseName}-${Environment}-${AWS::Region}"
      GroupDescription: !If
        - HasSecurityGroupDescription
        - !Ref SecurityGroupDescription
        - !Sub "Security group for ${AWS::StackName}"
      VpcId: !Ref VpcId
      Tags:
        - Key: Name
          Value: !If
            - HasCiSuffix
            - !Sub "${ProjectName}-${SecurityGroupBaseName}-${Environment}-${AWS::Region}-${CiSuffix}"
            - !Sub "${ProjectName}-${SecurityGroupBaseName}-${Environment}-${AWS::Region}"

  IngressRule1Cidr:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: HasRule1Cidr
    Properties:
      GroupId: !Ref SecurityGroup
      Description: !Join
        - ""
        - - !Ref Rule1RuleSet
          - " rule 1: "
          - !Select [0, !Split [",", !FindInMap [IngressRuleSets, !Ref Rule1RuleSet, Rule1]]]
          - " "
          - !Select [1, !Split [",", !FindInMap [IngressRuleSets, !Ref Rule1RuleSet, Rule1]]]
          - "-"
          - !Select [2, !Split [",", !FindInMap [IngressRuleSets, !Ref Rule1RuleSet, Rule1]]]
          - " from "
          - !Ref Rule1SourceCidr
      IpProtocol: !Select [0, !Split [",", !FindInMap [IngressRuleSets, !Ref Rule1RuleSet, Rule1]]]
      FromPort: !Select [1, !Split [",", !FindInMap [IngressRuleSets, !Ref Rule1RuleSet, Rule1]]]
      ToPort: !Select [2, !Split [",", !FindInMap [IngressRuleSets, !Ref Rule1RuleSet, Rule1]]]
      CidrIp: !Ref Rule1SourceCidr

  IngressRule1SecurityGroup:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: HasRule1SecurityGroup
    Properties:
      GroupId: !Ref SecurityGroup
      Description: !Join
        - ""
        - - !Ref Rule1RuleSet
          - " rule 1: "
          - !Select [0, !Split [",", !FindInMap [IngressRuleSets, !Ref Rule1RuleSet, Rule1]]]
          - " "
          - !Select [1, !Split [",", !FindInMap [IngressRuleSets, !Ref Rule1RuleSet, Rule1]]]
          - "-"
          - !Select [2, !Split [",", !FindInMap [IngressRuleSets, !Ref Rule1RuleSet, Rule1]]]
          - " from "
          - !Ref Rule1SourceSecurityGroupId
      IpProtocol: !Select [0, !Split [",", !FindInMap [IngressRuleSets, !Ref Rule1RuleSet, Rule1]]]
      FromPort: !Select [1, !Split [",", !FindInMap [IngressRuleSets, !Ref Rule1RuleSet, Rule1]]]
      ToPort: !Select [2, !Split [",", !FindInMap [IngressRuleSets, !Ref Rule1RuleSet, Rule1]]]
      SourceSecurityGroupId: !Ref Rule1SourceSecurityGroupId

  IngressRule2Cidr:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: HasRule2Cidr
    Properties:
      GroupId: !Ref SecurityGroup
      Description: !Join
        - ""
        - - !Ref Rule2RuleSet
          - " rule 2: "
          - !Select [0, !Split [",", !FindInMap [IngressRuleSets, !Ref Rule2RuleSet, Rule2]]]
          - " "
          - !Select [1, !Split [",", !FindInMap [IngressRuleSets, !Ref Rule2RuleSet, Rule2]]]
          - "-"
          - !Select [2, !Split [",", !FindInMap [IngressRuleSets, !Ref Rule2RuleSet, Rule2]]]
          - " from "
          - !Ref Rule2SourceCidr
      IpProtocol: !Select [0, !Split [",", !FindInMap [IngressRuleSets, !Ref Rule2RuleSet, Rule2]]]
      FromPort: !Select [1, !Split [",", !FindInMap [IngressRuleSets, !Ref Rule2RuleSet, Rule2]]]
      ToPort: !Select [2, !Split [",", !FindInMap [IngressRuleSets, !Ref Rule2RuleSet, Rule2]]]
      CidrIp: !Ref Rule2SourceCidr

  IngressRule2SecurityGroup:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: HasRule2SecurityGroup
    Properties:
      GroupId: !Ref SecurityGroup
      Description: !Join
        - ""
        - - !Ref Rule2RuleSet
          - " rule 2: "
          - !Select [0, !Split [",", !FindInMap [IngressRuleSets, !Ref Rule2RuleSet, Rule2]]]
          - " "
          - !Select [1, !Split [",", !FindInMap [IngressRuleSets, !Ref Rule2RuleSet, Rule2]]]
          - "-"
          - !Select [2, !Split [",", !FindInMap [IngressRuleSets, !Ref Rule2RuleSet, Rule2]]]
          - " from "
          - !Ref Rule2SourceSecurityGroupId
      IpProtocol: !Select [0, !Split [",", !FindInMap [IngressRuleSets, !Ref Rule2RuleSet, Rule2]]]
      FromPort: !Select [1, !Split [",", !FindInMap [IngressRuleSets, !Ref Rule2RuleSet, Rule2]]]
      ToPort: !Select [2, !Split [",", !FindInMap [IngressRuleSets, !Ref Rule2RuleSet, Rule2]]]
      SourceSecurityGroupId: !Ref Rule2SourceSecurityGroupId

  IngressRule3Cidr:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: HasRule3Cidr
    Properties:
      GroupId: !Ref SecurityGroup
      Description: !Join
        - ""
        - - !Ref Rule3RuleSet
          - " rule 3: "
          - !Select [0, !Split [",", !FindInMap [IngressRuleSets, !Ref Rule3RuleSet, Rule3]]]
          - " "
          - !Select [1, !Split [",", !FindInMap [IngressRuleSets, !Ref Rule3RuleSet, Rule3]]]
          - "-"
          - !Select [2, !Split [",", !FindInMap [IngressRuleSets, !Ref Rule3RuleSet, Rule3]]]
          - " from "
          - !Ref Rule3SourceCidr
      IpProtocol: !Select [0, !Split [",", !FindInMap [IngressRuleSets, !Ref Rule3RuleSet, Rule3]]]
      FromPort: !Select [1, !Split [",", !FindInMap [IngressRuleSets, !Ref Rule3RuleSet, Rule3]]]
      ToPort: !Select [2, !Split [",", !FindInMap [IngressRuleSets, !Ref Rule3RuleSet, Rule3]]]
      CidrIp: !Ref Rule3SourceCidr

  IngressRule3SecurityGroup:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: HasRule3SecurityGroup
    Properties:
      GroupId: !Ref SecurityGroup
      Description: !Join
        - ""
        - - !Ref Rule3RuleSet
          - " rule 3: "
          - !Select [0, !Split [",", !FindInMap [IngressRuleSets, !Ref Rule3RuleSet, Rule3]]]
          - " "
          - !Select [1, !Split [",", !FindInMap [IngressRuleSets, !Ref Rule3RuleSet, Rule3]]]
          - "-"
          - !Select [2, !Split [",", !FindInMap [IngressRuleSets, !Ref Rule3RuleSet, Rule3]]]
          - " from "
          - !Ref Rule3SourceSecurityGroupId
      IpProtocol: !Select [0, !Split [",", !FindInMap [IngressRuleSets, !Ref Rule3RuleSet, Rule3]]]
      FromPort: !Select [1, !Split [",", !FindInMap [IngressRuleSets, !Ref Rule3RuleSet, Rule3]]]
      ToPort: !Select [2, !Split [",", !FindInMap [IngressRuleSets, !Ref Rule3RuleSet, Rule3]]]
      SourceSecurityGroupId: !Ref Rule3SourceSecurityGroupId

  IngressRule4Cidr:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: HasRule4Cidr
    Properties:
      GroupId: !Ref SecurityGroup
      Description: !Join
        - ""
        - - !Ref Rule4RuleSet
          - " rule 4: "
          - !Select [0, !Split [",", !FindInMap [IngressRuleSets, !Ref Rule4RuleSet, Rule4]]]
          - " "
          - !Select [1, !Split [",", !FindInMap [IngressRuleSets, !Ref Rule4RuleSet, Rule4]]]
          - "-"
          - !Select [2, !Split [",", !FindInMap [IngressRuleSets, !Ref Rule4RuleSet, Rule4]]]
          - " from "
          - !Ref Rule4SourceCidr
      IpProtocol: !Select [0, !Split [",", !FindInMap [IngressRuleSets, !Ref Rule4RuleSet, Rule4]]]
      FromPort: !Select [1, !Split [",", !FindInMap [IngressRuleSets, !Ref Rule4RuleSet, Rule4]]]
      ToPort: !Select [2, !Split [",", !FindInMap [IngressRuleSets, !Ref Rule4RuleSet, Rule4]]]
      CidrIp: !Ref Rule4SourceCidr

  IngressRule4SecurityGroup:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: HasRule4SecurityGroup
    Properties:
      GroupId: !Ref SecurityGroup
      Description: !Join
        - ""
        - - !Ref Rule4RuleSet
          - " rule 4: "
          - !Select [0, !Split [",", !FindInMap [IngressRuleSets, !Ref Rule4RuleSet, Rule4]]]
          - " "
          - !Select [1, !Split [",", !FindInMap [IngressRuleSets, !Ref Rule4RuleSet, Rule4]]]
          - "-"
          - !Select [2, !Split [",", !FindInMap [IngressRuleSets, !Ref Rule4RuleSet, Rule4]]]
          - " from "
          - !Ref Rule4SourceSecurityGroupId
      IpProtocol: !Select [0, !Split [",", !FindInMap [IngressRuleSets, !Ref Rule4RuleSet, Rule4]]]
      FromPort: !Select [1, !Split [",", !FindInMap [IngressRuleSets, !Ref Rule4RuleSet, Rule4]]]
      ToPort: !Select [2, !Split [",", !FindInMap [IngressRuleSets, !Ref Rule4RuleSet, Rule4]]]
      SourceSecurityGroupId: !Ref Rule4SourceSecurityGroupId

  IngressRule5Cidr:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: HasRule5Cidr
    Properties:
      GroupId: !Ref SecurityGroup
      Description: !Join
        - ""
        - - !Ref Rule5RuleSet
          - " rule 5: "
          - !Select [0, !Split [",", !FindInMap [IngressRuleSets, !Ref Rule5RuleSet, Rule5]]]
          - " "
          - !Select [1, !Split [",", !FindInMap [IngressRuleSets, !Ref Rule5RuleSet, Rule5]]]
          - "-"
          - !Select [2, !Split [",", !FindInMap [IngressRuleSets, !Ref Rule5RuleSet, Rule5]]]
          - " from "
          - !Ref Rule5SourceCidr
      IpProtocol: !Select [0, !Split [",", !FindInMap [IngressRuleSets, !Ref Rule5RuleSet, Rule5]]]
      FromPort: !Select [1, !Split [",", !FindInMap [IngressRuleSets, !Ref Rule5RuleSet, Rule5]]]
      ToPort: !Select [2, !Split [",", !FindInMap [IngressRuleSets, !Ref Rule5RuleSet, Rule5]]]
      CidrIp: !Ref Rule5SourceCidr

  IngressRule5SecurityGroup:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: HasRule5SecurityGroup
    Properties:
      GroupId: !Ref SecurityGroup
      Description: !Join
        - ""
        - - !Ref Rule5RuleSet
          - " rule 5: "
          - !Select [0, !Split [",", !FindInMap [IngressRuleSets, !Ref Rule5RuleSet, Rule5]]]
          - " "
          - !Select [1, !Split [",", !FindInMap [IngressRuleSets, !Ref Rule5RuleSet, Rule5]]]
          - "-"
          - !Select [2, !Split [",", !FindInMap [IngressRuleSets, !Ref Rule5RuleSet, Rule5]]]
          - " from "
          - !Ref Rule5SourceSecurityGroupId
      IpProtocol: !Select [0, !Split [",", !FindInMap [IngressRuleSets, !Ref Rule5RuleSet, Rule5]]]
      FromPort: !Select [1, !Split [",", !FindInMap [IngressRuleSets, !Ref Rule5RuleSet, Rule5]]]
      ToPort: !Select [2, !Split [",", !FindInMap [IngressRuleSets, !Ref Rule5RuleSet, Rule5]]]
      SourceSecurityGroupId: !Ref Rule5SourceSecurityGroupId

Outputs:
  SecurityGroupId:
    Description: ID of the security group
    Value: !Ref SecurityGroup

  SecurityGroupName:
    Description: Name of the security group
    Value: !If
      - HasCiSuffix
      - !Sub "${ProjectName}-${SecurityGroupBaseName}-${Environment}-${AWS::Region}-${CiSuffix}"
      - !Sub "${ProjectName}-${SecurityGroupBaseName}-${Environment}-${AWS::Region}"
